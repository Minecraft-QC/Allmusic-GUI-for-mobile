# 构建三个 MC 版本的 AllMusic GUI（移动端移植版），产物上传为 Artifacts
name: build

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: ["1.21.1", "26.1.2", "26.3"]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - name: build ${{ matrix.dir }}
        working-directory: AllMusic-GUI/${{ matrix.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: upload jar (${{ matrix.dir }})
        uses: actions/upload-artifact@v7
        with:
          name: allmusic-gui-mobile-${{ matrix.dir }}
          path: AllMusic-GUI/${{ matrix.dir }}/build/libs/*.jar
